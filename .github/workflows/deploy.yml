name: Deploy Team DevSpace infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: team-devspace-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: metadata
        run: node scripts/ci-metadata.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.metadata.outputs.node }}
          package-manager-cache: false
      - name: Install locked build tools (no production credentials)
        env:
          BUILD_NPM: ${{ steps.metadata.outputs.npm }}
        run: npx --yes "$BUILD_NPM" ci --no-audit --no-fund
      - run: npm run check && npm test
      - name: Deploy existing infrastructure, migrations before Worker
        env:
          TEAM_DEVSPACE_RELEASE_PROFILE_JSON: ${{ vars.TEAM_DEVSPACE_RELEASE_PROFILE }}
          TEAM_DEVSPACE_DEPLOYMENT_JSON: ${{ secrets.TEAM_DEVSPACE_DEPLOYMENT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          CF_RUNTIME_API_TOKEN: ${{ secrets.CF_RUNTIME_API_TOKEN }}
          ADMIN_ACCESS_EMAILS: ${{ secrets.ADMIN_ACCESS_EMAILS }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          MASTER_KEY: ${{ secrets.MASTER_KEY }}
        run: npm run deploy -- --ci
