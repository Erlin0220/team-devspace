name: Deploy Team DevSpace infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: team-devspace-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CF_RUNTIME_API_TOKEN: ${{ secrets.CF_RUNTIME_API_TOKEN }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      MASTER_KEY: ${{ secrets.MASTER_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.0'
          cache: npm
      - run: npx --yes npm@11.19.1 ci --no-fund --no-audit
      - run: npm run check && npm test
      - run: npm run deploy -- --ci
