name: Validate accepted macOS x64 package on Intel

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Private draft containing the Codemagic PKG and its acceptance receipt
        type: string
        required: true
      package_sha256:
        description: Exact accepted Codemagic PKG SHA-256
        type: string
        required: true

permissions:
  # GitHub only exposes draft releases to callers with repository push access.
  # This manual trusted-source job still never publishes or changes a release.
  contents: write

concurrency:
  group: team-devspace-intel-acceptance
  cancel-in-progress: false

jobs:
  verify-existing-package:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CANDIDATE_TAG: ${{ inputs.candidate_tag }}
      TEAM_DEVSPACE_PACKAGE_SHA256: ${{ inputs.package_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: release
        run: node scripts/ci-metadata.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.release.outputs.node }}
          cache: npm
      - run: npx --yes ${{ steps.release.outputs.npm }} ci --no-fund --no-audit
      - name: Download the existing bytes, without building
        run: |
          mkdir -p build/intel-input
          gh release download "$CANDIDATE_TAG" --dir build/intel-input \
            --pattern '*macos-x64.pkg' --pattern 'acceptance-darwin-x64.json'
      - run: node scripts/macos-accept-existing.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: macos-x64-native-acceptance
          path: |
            release/offline/*/darwin-x64/acceptance.json
            build/macos-review/*.png
          if-no-files-found: error
          retention-days: 7
