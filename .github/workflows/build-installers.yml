name: Build, verify and publish private release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Sign and publish this fixed release to the private GitHub repository'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: team-devspace-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    environment: production
    outputs:
      matrix: ${{ steps.release.outputs.matrix }}
      version: ${{ steps.release.outputs.version }}
      node: ${{ steps.release.outputs.node }}
      npm: ${{ steps.release.outputs.npm }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: release
        run: node scripts/ci-metadata.mjs
      - name: Check publication credentials before any native build
        if: ${{ inputs.publish }}
        shell: bash
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          MACOS_INSTALLER_CERT_P12_BASE64: ${{ secrets.MACOS_INSTALLER_CERT_P12_BASE64 }}
          MACOS_INSTALLER_CERT_P12_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_P12_PASSWORD }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in WINDOWS_SIGNING_PFX_BASE64 WINDOWS_SIGNING_PFX_PASSWORD MACOS_INSTALLER_CERT_P12_BASE64 MACOS_INSTALLER_CERT_P12_PASSWORD MACOS_INSTALLER_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if test -z "${!name:-}"; then echo "::error::Missing production secret: $name"; missing=1; fi
          done
          test "$missing" = 0

  package:
    needs: metadata
    environment: production
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ needs.metadata.outputs.node }}
          cache: npm
      - name: Read canonical release metadata
        id: release
        shell: pwsh
        run: |
          node scripts/ci-metadata.mjs
      - name: Install locked build dependencies
        run: npx --yes ${{ needs.metadata.outputs.npm }} ci --no-fund --no-audit
      - name: Verify source and distribution contracts
        run: npm run check && npm run test:distribution
      - name: Check locked dependency security
        run: node node_modules/npm/bin/npm-cli.js audit
      - name: Test gateway and actual upstream runtime
        run: npm test
      - name: Validate unified gateway and static assets without deploying
        run: npm run deploy -- --dry-run
      - name: Build native component artifacts, offline layout and bootstrapper
        run: npm run package
      - name: Verify native user-session runtime
        # GitHub-hosted macOS jobs do not provide a durable employee login session for LaunchAgent lifecycle E2E.
        # macOS native startup is verified later on a real logged-in Mac; hosted CI still builds both native PKGs here.
        if: ${{ matrix.native_startup }}
        run: npm run test:native
      - name: Verify actual isolated Windows installer transaction
        if: ${{ matrix.target == 'win32-x64' }}
        run: npm run test:installer

      - name: Verify native Unix offline installer transaction
        if: ${{ matrix.target != 'win32-x64' }}
        run: npm run test:installer:unix

      - name: Require Windows signing material for publication
        if: ${{ inputs.publish && matrix.target == 'win32-x64' }}
        shell: pwsh
        env:
          SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if (-not $env:SIGNING_PFX -or -not $env:SIGNING_PASSWORD) { throw 'Windows Authenticode secrets are required to publish' }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\signing.pfx", [Convert]::FromBase64String($env:SIGNING_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { throw 'signtool.exe is unavailable' }
          $installer = "release\Team-DevSpace-$env:RELEASE_VERSION-windows-x64-setup.exe"
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f "$env:RUNNER_TEMP\signing.pfx" /p $env:SIGNING_PASSWORD $installer
          if ($LASTEXITCODE -ne 0) { throw 'Authenticode signing failed' }
          & $signtool.FullName verify /pa /all $installer
          if ($LASTEXITCODE -ne 0) { throw 'Authenticode verification failed' }
          Copy-Item $installer "release\offline\$env:RELEASE_VERSION\win32-x64" -Force
          $file = Get-Item $installer
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($file.Name)" | Set-Content "$($file.FullName).sha256" -Encoding ascii
          Copy-Item "$($file.FullName).sha256" "release\offline\$env:RELEASE_VERSION\win32-x64" -Force

      - name: Require Apple signing and notarization for publication
        if: ${{ inputs.publish && startsWith(matrix.target, 'darwin-') }}
        shell: bash
        env:
          INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERT_P12_BASE64 }}
          INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_P12_PASSWORD }}
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          for name in INSTALLER_CERTIFICATE INSTALLER_CERTIFICATE_PASSWORD INSTALLER_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            test -n "${!name:-}" || { echo "$name is required to publish" >&2; exit 1; }
          done
          KEYCHAIN="$RUNNER_TEMP/team-devspace.keychain-db"
          security create-keychain -p temporary "$KEYCHAIN"
          security unlock-keychain -p temporary "$KEYCHAIN"
          printf '%s' "$INSTALLER_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN" -P "$INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k temporary "$KEYCHAIN"
          PKG="release/Team-DevSpace-$RELEASE_VERSION-macos-${{ matrix.target == 'darwin-arm64' && 'arm64' || 'x64' }}.pkg"
          productsign --sign "$INSTALLER_IDENTITY" "$PKG" "$PKG.signed"
          mv "$PKG.signed" "$PKG"
          xcrun notarytool submit "$PKG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$PKG"
          pkgutil --check-signature "$PKG"
          xcrun stapler validate "$PKG"
          cp "$PKG" "release/offline/$RELEASE_VERSION/${{ matrix.target }}/"
          shasum -a 256 "$PKG" > "$PKG.sha256"
          cp "$PKG.sha256" "release/offline/$RELEASE_VERSION/${{ matrix.target }}/"

      - name: Remove temporary signing credentials
        if: ${{ always() && inputs.publish }}
        shell: pwsh
        run: |
          Remove-Item "$env:RUNNER_TEMP/signing.pfx", "$env:RUNNER_TEMP/installer.p12" -Force -ErrorAction SilentlyContinue
          if ($IsMacOS -and (Test-Path "$env:RUNNER_TEMP/team-devspace.keychain-db")) {
            security delete-keychain "$env:RUNNER_TEMP/team-devspace.keychain-db"
          }

      - name: Upload complete native layout and entrypoint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: team-devspace-${{ matrix.target }}
          path: release/offline/**
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Verify administrator handoff (publish only when requested)
    needs: [metadata, package]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ needs.metadata.outputs.node }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: team-devspace-*
          path: release/offline
          merge-multiple: true
      - name: Refuse publication from a public repository
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = true
      - name: Verify complete offline layouts before publication
        run: npm run verify:release
      - name: Assemble administrator handoff assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./release.config.json').version")
          mkdir -p release/publish
          (cd "release/offline/$VERSION/win32-x64" && zip -qr "../../../publish/Team-DevSpace-$VERSION-windows-x64-offline.zip" .)
          cp "release/offline/$VERSION/darwin-arm64/Team-DevSpace-$VERSION-macos-arm64.pkg" release/publish/
          cp "release/offline/$VERSION/darwin-x64/Team-DevSpace-$VERSION-macos-x64.pkg" release/publish/
          cp "release/offline/$VERSION/linux-x64/Team-DevSpace-$VERSION-linux-x64-offline.tar.gz" release/publish/
          cp "release/offline/$VERSION/linux-arm64/Team-DevSpace-$VERSION-linux-arm64-offline.tar.gz" release/publish/
          (cd release/publish && sha256sum * > SHA256SUMS)
      - name: Create immutable-by-policy private GitHub Release
        if: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./release.config.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; fixed-version releases are never overwritten." >&2
            exit 1
          fi
          gh release create "$TAG" release/publish/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Team DevSpace $VERSION" \
            --notes "Private administrator handoff. Employees install only from the complete offline package supplied by the administrator."
