name: Build, verify and publish private release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish this fixed internal release to the private GitHub repository'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: team-devspace-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-24.04
    environment: production
    outputs:
      matrix: ${{ steps.release.outputs.matrix }}
      version: ${{ steps.release.outputs.version }}
      node: ${{ steps.release.outputs.node }}
      npm: ${{ steps.release.outputs.npm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: release
        run: node scripts/ci-metadata.mjs
      - name: Check internal Windows signing identity before any native build
        if: ${{ inputs.publish }}
        shell: bash
        env:
          WINDOWS_INTERNAL_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_INTERNAL_SIGNING_PFX_BASE64 }}
          WINDOWS_INTERNAL_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_INTERNAL_SIGNING_PFX_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in WINDOWS_INTERNAL_SIGNING_PFX_BASE64 WINDOWS_INTERNAL_SIGNING_PFX_PASSWORD; do
            if test -z "${!name:-}"; then echo "::error::Missing production secret: $name"; missing=1; fi
          done
          test "$missing" = 0

  verify:
    name: Shared release verification
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.metadata.outputs.node }}
          cache: npm
      - name: Install locked build dependencies
        run: npx --yes ${{ needs.metadata.outputs.npm }} ci --no-fund --no-audit
      - name: Verify source and distribution contracts
        run: npm run check && npm run test:distribution
      - name: Check locked dependency security
        run: node node_modules/npm/bin/npm-cli.js audit
      - name: Test gateway and actual upstream runtime
        run: npm test
      - name: Validate unified gateway and static assets without deploying
        run: npm run deploy -- --dry-run

  package:
    needs: [metadata, verify]
    environment: production
    strategy:
      fail-fast: true
      max-parallel: 3
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.metadata.outputs.node }}
          cache: npm
      - name: Activate repository-pinned Rust toolchain
        if: ${{ matrix.target == 'win32-x64' || startsWith(matrix.target, 'darwin-') }}
        run: rustup show active-toolchain && rustc --version && cargo --version
      - name: Restore Rust dependency and tray release cache
        if: ${{ matrix.target == 'win32-x64' || startsWith(matrix.target, 'darwin-') }}
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: native/tray -> ../../build/tray-target-${{ matrix.target }}
          key: tray-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Restore pinned Zig toolchain
        if: ${{ matrix.target == 'win32-x64' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/zig-win32-x64
          key: team-devspace-zig-${{ matrix.target }}-${{ hashFiles('scripts/binaries.json') }}
      - name: Install locked build dependencies
        run: npx --yes ${{ needs.metadata.outputs.npm }} ci --no-fund --no-audit
      - name: Prepare optional protected macOS signing identity
        if: ${{ inputs.publish && startsWith(matrix.target, 'darwin-') }}
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          MACOS_APPLICATION_IDENTITY: ${{ secrets.MACOS_APPLICATION_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: node scripts/macos-signing.mjs prepare
      - name: Build native component artifacts and self-contained platform package
        run: npm run package
      - name: Enforce Linux glibc 2.34 runtime ceiling
        if: ${{ matrix.target == 'linux-x64' }}
        shell: bash
        run: |
          set -euo pipefail
          max_glibc=$(
            while IFS= read -r -d '' file; do
              readelf --version-info "$file" 2>/dev/null || true
            done < <(find build/bundle-linux-x64 -type f \( -perm /111 -o -name '*.node' -o -name '*.so' -o -name '*.so.*' \) -print0) |
              { grep -oE 'GLIBC_[0-9]+\.[0-9]+' || true; } |
              sort -Vu |
              tail -n 1
          )
          test -n "$max_glibc"
          highest=$(printf '%s\n' GLIBC_2.34 "$max_glibc" | sort -V | tail -n 1)
          if test "$highest" != GLIBC_2.34; then
            echo "::error::Linux runtime requires $max_glibc, above the supported GLIBC_2.34 ceiling"
            exit 1
          fi
          echo "Linux runtime ABI ceiling: $max_glibc"
      - name: Record macOS package trust mode
        if: ${{ inputs.publish && startsWith(matrix.target, 'darwin-') }}
        shell: bash
        run: |
          set -euo pipefail
          if test "${TEAM_DEVSPACE_MACOS_SIGNING:-}" = 1; then
            echo "Developer ID app/installer signatures, notarization and staple verification completed."
          else
            echo "internal-free: macOS PKG remains unsigned/unnotarized because no Apple credentials were configured."
          fi
      - name: Remove temporary macOS signing material
        if: ${{ always() && inputs.publish && startsWith(matrix.target, 'darwin-') }}
        run: node scripts/macos-signing.mjs cleanup
      - name: Start and exercise the native Windows tray protocol
        if: ${{ matrix.target == 'win32-x64' }}
        run: npm run test:tray
      - name: Prepare Linux systemd user manager for lifecycle verification
        if: ${{ matrix.target == 'linux-x64' }}
        shell: bash
        run: |
          set -euo pipefail
          uid=$(id -u)
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$uid.service"
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
          test -S "/run/user/$uid/bus"
          XDG_RUNTIME_DIR="/run/user/$uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" systemctl --user daemon-reload
      - name: Verify native user-session runtime
        # macOS hosted runners do not expose a durable employee LaunchAgent session. Linux gets a real
        # per-user systemd manager above; Windows uses the logged-in Task Scheduler session.
        if: ${{ matrix.native_startup }}
        run: npm run test:native
      - name: Clean Linux lifecycle test session
        if: ${{ always() && matrix.target == 'linux-x64' }}
        shell: bash
        run: sudo loginctl disable-linger "$USER" || true
      - name: Verify actual isolated Windows installer transaction
        if: ${{ inputs.publish && matrix.target == 'win32-x64' }}
        run: npm run test:installer

      - name: Verify native Unix offline installer transaction
        if: ${{ matrix.target != 'win32-x64' }}
        run: npm run test:installer:unix

      - name: Sign Windows installer with the fixed internal publisher identity
        if: ${{ inputs.publish && matrix.target == 'win32-x64' }}
        shell: pwsh
        env:
          WINDOWS_INTERNAL_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_INTERNAL_SIGNING_PFX_BASE64 }}
          WINDOWS_INTERNAL_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_INTERNAL_SIGNING_PFX_PASSWORD }}
          TEAM_DEVSPACE_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: ./scripts/sign-internal-windows.ps1

      - name: Upload complete native layout and entrypoint
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: team-devspace-${{ matrix.target }}
          path: release/offline/**
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Verify administrator handoff (publish only when requested)
    needs: [metadata, package]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.metadata.outputs.node }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: team-devspace-*
          path: release/offline
          merge-multiple: true
      - name: Refuse publication from a public repository
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = true
      - name: Verify complete offline layouts before publication
        run: npm run verify:release
      - name: Require the live Gateway to match this client protocol
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e "import release from './release.config.json' with { type: 'json' }; import { healthMatches } from './scripts/deploy-checks.mjs'; const response = await fetch(new URL('/health', release.gateway), { signal: AbortSignal.timeout(10000), redirect: 'error' }); const health = await response.json().catch(() => null); if (!response.ok || !healthMatches(health, release)) throw new Error('Live Gateway release/control API does not match this installer release'); console.log(JSON.stringify({ gateway: release.gateway, release: health.release, controlApi: health.controlApi }));"
      - name: Assemble administrator handoff assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./release.config.json').version")
          mkdir -p release/publish release/windows-handoff
          cp "release/offline/$VERSION/win32-x64/Team-DevSpace-$VERSION-windows-x64-setup.exe" release/windows-handoff/
          if test "${{ inputs.publish }}" = true; then
            cp "release/offline/$VERSION/win32-x64/Team-DevSpace-Internal-Publisher.cer" release/windows-handoff/
            cp "release/offline/$VERSION/win32-x64/Trust-Team-DevSpace-Internal-Publisher.ps1" release/windows-handoff/
          fi
          (cd release/windows-handoff && zip -q "../publish/Team-DevSpace-$VERSION-windows-x64.zip" ./*)
          cp "release/offline/$VERSION/darwin-arm64/Team-DevSpace-$VERSION-macos-arm64.pkg" release/publish/
          cp "release/offline/$VERSION/linux-x64/Team-DevSpace-$VERSION-linux-x64-offline.tar.gz" release/publish/
          cp docs/internal-distribution.md release/publish/INTERNAL-DISTRIBUTION.md
          (cd release/publish && sha256sum * > SHA256SUMS)
      - name: Create immutable-by-policy private GitHub Release
        if: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./release.config.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; fixed-version releases are never overwritten." >&2
            exit 1
          fi
          gh release create "$TAG" release/publish/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Team DevSpace $VERSION" \
            --notes "Private internal administrator handoff. Windows uses one self-contained installer EXE plus the bundled Team DevSpace self-signed publisher certificate/current-user trust helper; no external runtime objects are required. macOS packages use Developer ID/notarization only when protected Apple credentials were supplied; otherwise they are explicitly unsigned/unnotarized. Follow INTERNAL-DISTRIBUTION.md and verify SHA256SUMS."
