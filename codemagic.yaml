workflows:
  macos-arm64-package:
    name: macOS arm64 package
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 22.23.0
      npm: 11.19.1
      xcode: 26.0
      vars:
        TEAM_DEVSPACE_SKIP_TRAY_TESTS: "1"
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.cargo/registry
        - $HOME/.cargo/git
        - $HOME/Library/Caches/go-build
        - $HOME/.cache/team-devspace
        - $CM_BUILD_DIR/build/cache
        - $CM_BUILD_DIR/build/tray-target-darwin-arm64
        - $CM_BUILD_DIR/build/bundle-darwin-arm64/node_modules
        - $CM_BUILD_DIR/build/bundle-darwin-arm64/.dependency-fingerprint
    scripts:
      - name: Install locked build dependencies
        script: |
          set -euo pipefail
          npm ci --no-fund --no-audit

      - name: Prepare native toolchains and pinned cloudflared
        script: |
          set -euo pipefail

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain 1.85.1
            echo "PATH=$HOME/.cargo/bin:$PATH" >> "$CM_ENV"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.85.1 --profile minimal --no-self-update
          rustup show active-toolchain

          go_version="$(node -p "require('./release.config.json').cloudflaredGoVersion")"
          go_root="$HOME/.cache/team-devspace/go-$go_version"
          go_archive="$CM_BUILD_DIR/build/cache/go${go_version}.darwin-arm64.tar.gz"
          if [ ! -x "$go_root/bin/go" ]; then
            mkdir -p "$(dirname "$go_archive")" "$HOME/.cache/team-devspace"
            if [ ! -f "$go_archive" ]; then
              curl --proto '=https' --tlsv1.2 --fail --location --retry 4 \
                --output "$go_archive" "https://go.dev/dl/go${go_version}.darwin-arm64.tar.gz"
            fi
            tar -tzf "$go_archive" >/dev/null
            unpack="$HOME/.cache/team-devspace/go-unpack"
            rm -rf "$unpack" "$go_root"
            mkdir -p "$unpack"
            tar -xzf "$go_archive" -C "$unpack"
            mv "$unpack/go" "$go_root"
            rmdir "$unpack"
          fi
          test "$("$go_root/bin/go" version | awk '{print $3}')" = "go$go_version"

          commit="$(node -p "require('./release.config.json').cloudflaredSourceCommit")"
          version="$(node -p "require('./release.config.json').cloudflaredVersion")"
          minimum="$(node -p "require('./release.config.json').distribution.macosMinimumVersion")"
          source="$CM_BUILD_DIR/build/cloudflared-source"
          output="$HOME/.cache/team-devspace/cloudflared-${commit}-${go_version}-macos${minimum}-arm64"
          if [ ! -x "$output" ] || ! "$output" --version | grep -Fq "$version"; then
            rm -f "$output"
            rm -rf "$source"
            git init -q "$source"
            git -C "$source" remote add origin https://github.com/cloudflare/cloudflared.git
            git -C "$source" fetch --quiet --depth=1 origin "$commit"
            git -C "$source" checkout --quiet --detach FETCH_HEAD
            (
              cd "$source"
              MACOSX_DEPLOYMENT_TARGET="$minimum" CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
                "$go_root/bin/go" build -mod=vendor -trimpath -ldflags "-X main.Version=$version" \
                  -o "$output" github.com/cloudflare/cloudflared/cmd/cloudflared
            )
          fi
          "$output" --version
          echo "TEAM_DEVSPACE_CLOUDFLARED_BINARY=$output" >> "$CM_ENV"

      - name: Build unsigned macOS package
        script: |
          set -euo pipefail
          npm run package -- --reuse-dependencies
          node scripts/verify-release.mjs --target darwin-arm64

      - name: Check arm64 and minimum macOS compatibility
        script: |
          set -euo pipefail
          root="build/bundle-darwin-arm64"
          minimum="$(node -p "require('./release.config.json').distribution.macosMinimumVersion")"
          checked=0
          offenders=0
          while IFS= read -r -d '' file; do
            description="$(/usr/bin/file "$file")"
            [[ "$description" == *Mach-O* ]] || continue
            checked=$((checked + 1))
            archs="$(/usr/bin/lipo -archs "$file")"
            if [[ " $archs " != *" arm64 "* ]]; then
              echo "macOS architecture mismatch: $file -> $archs" >&2
              offenders=1
              continue
            fi
            versions="$(/usr/bin/otool -l "$file" | /usr/bin/awk '
              $1 == "cmd" && $2 == "LC_BUILD_VERSION" { build=1; legacy=0; next }
              build && $1 == "minos" { print $2; build=0; next }
              $1 == "cmd" && $2 == "LC_VERSION_MIN_MACOSX" { legacy=1; build=0; next }
              legacy && $1 == "version" { print $2; legacy=0 }
            ')"
            if [[ -z "$versions" ]]; then
              echo "macOS minimum-version metadata missing: $file" >&2
              offenders=1
              continue
            fi
            while IFS= read -r actual; do
              if ! /usr/bin/awk -v actual="$actual" -v minimum="$minimum" '
                function part(v,n,a) { split(v,a,"."); return (a[n] == "" ? 0 : a[n]) + 0 }
                BEGIN { for (i=1;i<=3;i++) { a=part(actual,i); m=part(minimum,i); if (a<m) exit 0; if (a>m) exit 1 } exit 0 }
              '; then
                echo "macOS deployment target mismatch: $file -> $actual (configured $minimum)" >&2
                offenders=1
              fi
            done <<< "$versions"
          done < <(find "$root" -type f -print0)
          [[ "$checked" -gt 0 ]]
          [[ "$offenders" -eq 0 ]]
          echo "Verified $checked Mach-O files for arm64 and macOS <= $minimum"

    artifacts:
      - release/Team-DevSpace-*-macos-arm64.pkg
      - release/Team-DevSpace-*-macos-arm64.pkg.sha256
