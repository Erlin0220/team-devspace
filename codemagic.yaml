workflows:
  macos-package:
    name: macOS package
    inputs:
      architecture:
        description: macOS package architecture
        type: choice
        options:
          - arm64
          - x64
        default: arm64
    labels:
      - macOS package
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 22.23.0
      npm: 11.19.1
      xcode: 26.0
    cache:
      cache_paths:
        - $HOME/.cache/team-devspace-native-v1
        - $CM_BUILD_DIR/build/cache
    scripts:
      - name: Prepare verified native artifacts
        script: |
          set -euo pipefail

          # REST builds use documented environment variables; UI builds retain
          # the existing architecture input. Never silently build another ref.
          requested_arch="${TEAM_DEVSPACE_BUILD_ARCHITECTURE:-${{ inputs.architecture }}}"
          expected_commit="${TEAM_DEVSPACE_EXPECTED_COMMIT:-}"
          if [ -n "$expected_commit" ]; then
            [[ "$expected_commit" =~ ^[a-f0-9]{40}$ ]]
            test "$(git rev-parse HEAD)" = "$expected_commit"
            git diff --quiet HEAD --
          fi
          case "$requested_arch" in
            arm64) go_arch=arm64; macho_arch=arm64 ;;
            x64) go_arch=amd64; macho_arch=x86_64 ;;
            *) echo "Unsupported macOS architecture: $requested_arch" >&2; exit 2 ;;
          esac
          target="darwin-$requested_arch"
          native_cache="$HOME/.cache/team-devspace-native-v1"
          cloud_cache="$native_cache/cloudflared-$target"
          mkdir -p "$native_cache" "$CM_BUILD_DIR/build/cache"
          rm -rf "$native_cache/cloudflared"

          minimum="$(node -p "require('./release.config.json').distribution.macosMinimumVersion")"
          commit="$(node -p "require('./release.config.json').cloudflaredSourceCommit")"
          version="$(node -p "require('./release.config.json').cloudflaredVersion")"
          go_version="$(node -p "require('./release.config.json').cloudflaredGoVersion")"

          echo "TEAM_DEVSPACE_TARGET=$target" >> "$CM_ENV"
          echo "TEAM_DEVSPACE_EXPECTED_MACHO_ARCH=$macho_arch" >> "$CM_ENV"
          if [ "$requested_arch" = x64 ]; then
            node_url="$(node -p "require('./scripts/binaries.json').node['$target'].url")"
            node_sha="$(node -p "require('./scripts/binaries.json').node['$target'].sha256")"
            node_archive="$CM_BUILD_DIR/build/cache/$(/usr/bin/basename "$node_url")"
            if [ ! -f "$node_archive" ] || [ "$(/usr/bin/shasum -a 256 "$node_archive" 2>/dev/null | /usr/bin/awk '{print $1}')" != "$node_sha" ]; then
              node_partial="$node_archive.partial"
              rm -f "$node_partial"
              curl --proto '=https' --tlsv1.2 --fail --location --retry 4 --output "$node_partial" "$node_url"
              test "$(/usr/bin/shasum -a 256 "$node_partial" | /usr/bin/awk '{print $1}')" = "$node_sha"
              mv "$node_partial" "$node_archive"
            fi
            package_node_root="$CM_BUILD_DIR/build/package-node-$target"
            rm -rf "$package_node_root"
            mkdir -p "$package_node_root"
            tar -xzf "$node_archive" -C "$package_node_root" --strip-components=1
            package_node="$package_node_root/bin/node"
            package_npm_cli="$(npm root -g)/npm/bin/npm-cli.js"
            expected_npm="$(node -p "require('./package.json').packageManager.replace(/^npm@/,'')")"
            test -x "$package_node"
            test -f "$package_npm_cli"
            if ! PATH="$package_node_root/bin:$PATH" /usr/bin/arch -x86_64 "$package_node" "$package_npm_cli" --version | /usr/bin/grep -Fxq "$expected_npm"; then
              echo 'Intel macOS packaging requires Rosetta on the Apple Silicon Codemagic runner.' >&2
              exit 1
            fi
            echo "TEAM_DEVSPACE_PACKAGE_NODE=$package_node" >> "$CM_ENV"
            echo "TEAM_DEVSPACE_PACKAGE_NPM_CLI=$package_npm_cli" >> "$CM_ENV"
          fi

          compatible_macho() {
            file="$1"
            [ -x "$file" ] || return 1
            /usr/bin/file "$file" | /usr/bin/grep -q 'Mach-O' || return 1
            archs="$(/usr/bin/lipo -archs "$file" 2>/dev/null)" || return 1
            [[ " $archs " == *" $macho_arch "* ]] || return 1
            versions="$(/usr/bin/otool -l "$file" | /usr/bin/awk '
              $1 == "cmd" && $2 == "LC_BUILD_VERSION" { build=1; legacy=0; next }
              build && $1 == "minos" { print $2; build=0; next }
              $1 == "cmd" && $2 == "LC_VERSION_MIN_MACOSX" { legacy=1; build=0; next }
              legacy && $1 == "version" { print $2; legacy=0 }
            ')" || return 1
            [ -n "$versions" ] || return 1
            while IFS= read -r actual; do
              /usr/bin/awk -v actual="$actual" -v minimum="$minimum" '
                function part(v,n,a) { split(v,a,"."); return (a[n] == "" ? 0 : a[n]) + 0 }
                BEGIN { for (i=1;i<=3;i++) { a=part(actual,i); m=part(minimum,i); if (a<m) exit 0; if (a>m) exit 1 } exit 0 }
              ' || return 1
            done <<< "$versions"
          }

          cloud_builder_sha="$(/usr/bin/shasum -a 256 codemagic.yaml | /usr/bin/awk '{print $1}')"
          cloud_fingerprint="$(printf '%s\n' \
            'schema=1' \
            "builder=$cloud_builder_sha" \
            "version=$version" \
            "commit=$commit" \
            "go=$go_version" \
            "minimum=$minimum" \
            "target=$target" \
            'cgo=0' \
            'flags=-mod=vendor -trimpath -ldflags=-X main.Version' \
            | /usr/bin/shasum -a 256 | /usr/bin/awk '{print $1}')"

          cloud_hit=0
          if [ -x "$cloud_cache/cloudflared" ] && [ -f "$cloud_cache/metadata.json" ] && \
             [ -f "$cloud_cache/cloudflared.sha256" ] && \
             (cd "$cloud_cache" && /usr/bin/shasum -a 256 -c cloudflared.sha256 >/dev/null 2>&1) && \
             node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(process.argv[1]));if(m.schema!==1||m.fingerprint!==process.argv[2]||m.version!==process.argv[3]||m.sourceCommit!==process.argv[4]||m.goVersion!==process.argv[5]||m.minimumMacOS!==process.argv[6]||m.target!==process.argv[7])process.exit(1)" \
               "$cloud_cache/metadata.json" "$cloud_fingerprint" "$version" "$commit" "$go_version" "$minimum" "$target" && \
             "$cloud_cache/cloudflared" --version | /usr/bin/grep -Fq "$version" && \
             compatible_macho "$cloud_cache/cloudflared"; then
            cloud_hit=1
            echo "Reusing verified cloudflared final artifact cache."
          else
            rm -rf "$cloud_cache"
            tools="$CM_BUILD_DIR/build/native-tools"
            go_root="$tools/go-$go_version"
            go_archive="$tools/go${go_version}.darwin-arm64.tar.gz"
            source="$CM_BUILD_DIR/build/cloudflared-source"
            output="$tools/cloudflared"
            rm -rf "$tools" "$source"
            mkdir -p "$tools"
            curl --proto '=https' --tlsv1.2 --fail --location --retry 4 \
              --output "$go_archive" "https://go.dev/dl/go${go_version}.darwin-arm64.tar.gz"
            tar -tzf "$go_archive" >/dev/null
            tar -xzf "$go_archive" -C "$tools"
            mv "$tools/go" "$go_root"
            test "$("$go_root/bin/go" version | /usr/bin/awk '{print $3}')" = "go$go_version"

            git init -q "$source"
            git -C "$source" remote add origin https://github.com/cloudflare/cloudflared.git
            git -C "$source" fetch --quiet --depth=1 origin "$commit"
            git -C "$source" checkout --quiet --detach FETCH_HEAD
            (
              cd "$source"
              MACOSX_DEPLOYMENT_TARGET="$minimum" CGO_ENABLED=0 GOOS=darwin GOARCH="$go_arch" \
                "$go_root/bin/go" build -mod=vendor -trimpath -ldflags "-X main.Version=$version" \
                  -o "$output" github.com/cloudflare/cloudflared/cmd/cloudflared
            )
            chmod 0755 "$output"
            "$output" --version | /usr/bin/grep -Fq "$version"
            compatible_macho "$output"

            staging="$native_cache/.cloudflared-$target-${CM_BUILD_ID:-$$}"
            rm -rf "$staging"
            mkdir -p "$staging"
            cp "$output" "$staging/cloudflared"
            chmod 0755 "$staging/cloudflared"
            (cd "$staging" && /usr/bin/shasum -a 256 cloudflared > cloudflared.sha256)
            node -e "const fs=require('fs');fs.writeFileSync(process.argv[1],JSON.stringify({schema:1,fingerprint:process.argv[2],version:process.argv[3],sourceCommit:process.argv[4],goVersion:process.argv[5],minimumMacOS:process.argv[6],target:process.argv[7]},null,2)+'\\n')" \
              "$staging/metadata.json" "$cloud_fingerprint" "$version" "$commit" "$go_version" "$minimum" "$target"
            rm -rf "$cloud_cache"
            mv "$staging" "$cloud_cache"
          fi
          echo "TEAM_DEVSPACE_CLOUDFLARED_BINARY=$cloud_cache/cloudflared" >> "$CM_ENV"
          echo "TEAM_DEVSPACE_CLOUDFLARED_CACHE_HIT=$cloud_hit" >> "$CM_ENV"

          # The small AppKit helper is compiled directly by package.mjs using
          # the pinned Xcode SDK. No Rust installation or UI artifact cache.
          echo "Native artifact cache: cloudflared=$cloud_hit"

      - name: Build unsigned macOS package
        script: |
          set -euo pipefail
          if [ "$TEAM_DEVSPACE_TARGET" = darwin-x64 ]; then
            package_node_dir="$(/usr/bin/dirname "$TEAM_DEVSPACE_PACKAGE_NODE")"
            PATH="$package_node_dir:$PATH" /usr/bin/arch -x86_64 "$TEAM_DEVSPACE_PACKAGE_NODE" "$TEAM_DEVSPACE_PACKAGE_NPM_CLI" run package
          else
            npm run package
          fi
          node scripts/verify-release.mjs --target "$TEAM_DEVSPACE_TARGET"

      - name: Check architecture and minimum macOS compatibility
        script: |
          set -euo pipefail
          root="build/bundle-$TEAM_DEVSPACE_TARGET"
          minimum="$(node -p "require('./release.config.json').distribution.macosMinimumVersion")"
          checked=0
          offenders=0
          while IFS= read -r -d '' file; do
            description="$(/usr/bin/file "$file")"
            [[ "$description" == *Mach-O* ]] || continue
            checked=$((checked + 1))
            archs="$(/usr/bin/lipo -archs "$file")"
            if [[ " $archs " != *" $TEAM_DEVSPACE_EXPECTED_MACHO_ARCH "* ]]; then
              echo "macOS architecture mismatch: $file -> $archs" >&2
              offenders=1
              continue
            fi
            versions="$(/usr/bin/otool -l "$file" | /usr/bin/awk '
              $1 == "cmd" && $2 == "LC_BUILD_VERSION" { build=1; legacy=0; next }
              build && $1 == "minos" { print $2; build=0; next }
              $1 == "cmd" && $2 == "LC_VERSION_MIN_MACOSX" { legacy=1; build=0; next }
              legacy && $1 == "version" { print $2; legacy=0 }
            ')"
            if [[ -z "$versions" ]]; then
              echo "macOS minimum-version metadata missing: $file" >&2
              offenders=1
              continue
            fi
            while IFS= read -r actual; do
              if ! /usr/bin/awk -v actual="$actual" -v minimum="$minimum" '
                function part(v,n,a) { split(v,a,"."); return (a[n] == "" ? 0 : a[n]) + 0 }
                BEGIN { for (i=1;i<=3;i++) { a=part(actual,i); m=part(minimum,i); if (a<m) exit 0; if (a>m) exit 1 } exit 0 }
              '; then
                echo "macOS deployment target mismatch: $file -> $actual (configured $minimum)" >&2
                offenders=1
              fi
            done <<< "$versions"
          done < <(find "$root" -type f \( -perm -111 -o -name '*.node' -o -name '*.dylib' -o -name '*.so' -o -name '*.bundle' \) -print0)
          [[ "$checked" -gt 0 ]]
          [[ "$offenders" -eq 0 ]]
          cache_kb="$(du -sk "$HOME/.cache/team-devspace-native-v1" | /usr/bin/awk '{print $1}')"
          [[ "$cache_kb" -le 131072 ]]
          echo "Verified $checked Mach-O files for $TEAM_DEVSPACE_EXPECTED_MACHO_ARCH and macOS <= $minimum; native cache $((cache_kb / 1024)) MiB"

      - name: Accept installed macOS package
        script: |
          set -euo pipefail
          if [ "$TEAM_DEVSPACE_TARGET" = darwin-x64 ]; then
            /usr/bin/arch -x86_64 "$TEAM_DEVSPACE_PACKAGE_NODE" scripts/platform-acceptance.mjs --system-macos-installer
          else
            node scripts/platform-acceptance.mjs --system-macos-installer
          fi

    artifacts:
      - release/Team-DevSpace-*-macos-*.pkg
      - release/Team-DevSpace-*-macos-*.pkg.sha256
      - release/offline/*/darwin-*/acceptance.json
      - build/macos-review/*.png
