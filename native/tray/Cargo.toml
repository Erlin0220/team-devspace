[package]
name = "team-devspace-tray"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[dependencies]
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
tray-icon = { version = "=0.24.2", default-features = false }
winit = "=0.30.12"

[profile.release]
lto = "thin"
panic = "abort"
strip = true
